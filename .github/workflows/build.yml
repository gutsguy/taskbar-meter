name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v7
        with:
          name: TaskbarMeter
          path: TaskbarMeter.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: TaskbarMeter.exe
          generate_release_notes: true
